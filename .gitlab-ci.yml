# GitLab CI pour Le Coteau Fleuri (app)
#
# GitLab est le dépôt canonique mais ne fait plus qu'une chose : pousser
# branches et tags vers le miroir GitHub, où GitHub Actions calcule la version,
# builde, puis pose le tag `vX.Y.Z` ICI une fois tous les builds verts
# (cf. .github/workflows/release.yml).
#
# Flow complet :
#   1. Dev pousse des commits conventionnels sur main (feat:, fix:, ...)
#   2. `mirror-to-github` repousse branches + tags vers GitHub
#   3. GitHub Actions (push main) : version (semantic-release --dry-run) →
#      builds → gate → tag `vX.Y.Z` poussé sur GitLab → GitHub Release → stores
#   4. Le tag créé sur GitLab relance ce pipeline (règle `$CI_COMMIT_TAG`) :
#      `mirror-to-github` le repousse vers GitHub, où il existe déjà — no-op.
#      Le workflow GitHub ne se déclenche pas sur les tags : pas de boucle.
#
# Un build raté ne laisse donc ni tag ni commit à défaire : la version n'est
# posée qu'une fois les binaires produits.
#
# Pourquoi un job CI plutôt que le seul miroir natif GitLab : le push
# mirroring intégré est asynchrone et best-effort — il peut retarder ou rater
# un push, et donc ne jamais déclencher les Actions. Ce job le force dans le
# pipeline et échoue visiblement s'il ne passe pas.
#
# Pré-requis GitLab :
#   - Variable CI/CD `GITHUB_TOKEN` (masquée) : PAT GitHub avec droit
#     d'écriture sur le dépôt miroir — classic avec scope `repo`, ou
#     fine-grained avec `Contents: read & write` sur deadLocks21/lecoteaufleuri-app.
# Le jeton GitLab qui pose les tags vit côté GitHub (secret `GITLAB_TOKEN`).

variables:
  GITHUB_MIRROR_URL: "https://github.com/deadLocks21/lecoteaufleuri-app.git"

# Un stage « normal » est obligatoire : GitLab ne lance pas un pipeline qui ne
# contient que des jobs `.pre` / `.post`.
stages:
  - mirror

mirror-to-github:
  stage: mirror
  variables:
    # Clone complet : on repousse toutes les branches et tous les tags, pas
    # seulement le ref du pipeline.
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    # `${VAR#https://}` retire le préfixe pour réinjecter le token dans l'URL.
    - git remote add github "https://oauth2:${GITHUB_TOKEN}@${GITHUB_MIRROR_URL#https://}"
  script:
    # Pas de `git push --mirror` : il pousserait aussi les refs internes GitLab
    # (refs/pipelines/*, refs/merge-requests/*) et supprimerait côté GitHub tout
    # ref absent d'ici. On énumère explicitement les branches, puis les tags.
    - git push --force github "refs/remotes/origin/*:refs/heads/*"
    - git push --force --tags github
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'
